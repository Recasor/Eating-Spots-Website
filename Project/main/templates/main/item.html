{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title></title>

    <link rel="stylesheet" href="{% static 'main/css/global.css' %}" />
    <link rel="stylesheet" href="{% static 'main/css/item.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <script src="{% static 'main/js/item.js' %}" defer></script>
    <script src="{% static 'main/js/global.js' %}" defer></script>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <a class="header__logo" href="index.html"> Название </a>
        </div>
      </header>
      <main class="main">
        <section class="promo">
          <div class="promo__container">
            <a href="{% url 'index' %}" class="return-link"
              ><i class="fa fa-long-arrow-left" aria-hidden="true"></i> Назад</a
            >
            <h1 class="promo__title"></h1>
            <p class="promo__rating star-rating"><span></span></p>
            <div class="promo__gallery"></div>
          </div>
        </section>
        <section class="about">
          <div class="about__container">
            <h2 class="about__title">Про столовую</h2>
            <p class="about__text"></p>
          </div>
        </section>
        <section class="location">
          <div class="location__container">
            <h2 class="location__title">Местоположение</h2>
            <div class="location__content">
              <div class="location__content-map location__map"></div>
              <div class="location__content-info location__info">
                <a href="" class="map" target="_blank"
                  ><img
                    src="static/main/img/icons/map.svg"
                    aria-hidden="true"
                    height="24px" /><span></span
                ></a>
                <a href="" class="phone"
                  ><img
                    src="static/main/img/icons/phone.svg"
                    aria-hidden="true"
                    height="24px" /><span></span
                ></a>
              </div>
            </div>
          </div>
        </section>
        <section class="menu">
          <div class="menu__container">
            <h2 class="menu__title">Меню</h2>
            <nav class="menu__nav">
              <ul class="menu__nav-ul tab-parent">
              </ul>
            </nav>
            <div class="menu__content" id="menu"></div>
          </div>
        </section>
        <section class="reviews">
          <div class="reviews__container">
            <h3 class="reviews__title">Отзывы</h3>
            <div class="reviews__global">
              <div class="reviews__global-left reviews__left">
                <h4 class="reviews__left-title"></h4>
                <p class="reviews__left-description"></p>
                <p class="reviews__left-stars star-rating"><span></span></p>
              </div>
              <div class="separator"></div>
              <div class="reviews__global-right">
                <div class="reviews__global-right_item">
                  <h5 class="reviews__global-right_item-title">Еда</h5>
                  <div class="reviews__global-right_item-bar" id="foodPercent">
                    <span class="bar"><span class="filled"></span></span
                    ><span class="percent"></span>
                  </div>
                </div>
                <div class="reviews__global-right_item">
                  <h5 class="reviews__global-right_item-title">Персонал</h5>
                  <div class="reviews__global-right_item-bar" id="staffPercent">
                    <span class="bar"><span class="filled"></span></span
                    ><span class="percent"></span>
                  </div>
                </div>
                <div class="reviews__global-right_item">
                  <h5 class="reviews__global-right_item-title">Чистота</h5>
                  <div
                    class="reviews__global-right_item-bar"
                    id="purityPercent"
                  >
                    <span class="bar"><span class="filled"></span></span
                    ><span class="percent"></span>
                  </div>
                </div>
              </div>
            </div>
            <h4 class="reviews__subtitle">Оставить отзыв</h4>
            <form
              action="javascript:void(0)"
              class="reviews__form"
              id="reviewsForm"
            >
              <div class="reviews__form-stars">
                <i class="fa-regular fa-star" data-value="1"></i>
                <i class="fa-regular fa-star" data-value="2"></i>
                <i class="fa-regular fa-star" data-value="3"></i>
                <i class="fa-regular fa-star" data-value="4"></i>
                <i class="fa-regular fa-star" data-value="5"></i>
              </div>
              <textarea
                required
                name="reviewsText"
                id="reviewsText"
                cols="30"
                rows="5"
                class="reviews__form-textarea"
                placeholder="Поделитесь впечатлениями"
                style="resize: vertical"
              ></textarea>
              <input
                type="hidden"
                id="reviewRatingValue"
                name="reviewRatingValue"
              />
              <button type="submit" class="reviews__form-btn">Отправить</button>
            </form>
            <div class="reviews__ready">
              <h4 class="reviews__ready-title">Все отзывы</h4>
              <div class="reviews__ready-content reviews__items"></div>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <div class="footer__container">
          <a class="footer__link" href="">
            <img src="static/main/img/icons/question.svg" aria-hidden="true" />
            Помощь
          </a>
        </div>
      </footer>
    </div>

    <div id="searchCafe" hidden="hidden"></div>
  </body>
</html>
